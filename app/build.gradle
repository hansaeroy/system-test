}

android {
    namespace 'com.mamedeun.cashcalculator'
    compileSdk 35

    defaultConfig {
        applicationId "com.mamedeun.cashcalculator"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
